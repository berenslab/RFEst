name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    # No uv.lock is committed, so each run resolves dependencies afresh and a
    # release that breaks rfest shows up here rather than in someone's install.
    - name: Run tests
      run: uv run --python ${{ matrix.python-version }} --group dev pytest tests/ -v

  format:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    # `ruff check` is deliberately not run yet. The tree has 243 lint findings,
    # and a gate that passes because it is not looking is worth nothing. It is
    # added by the change that clears them.
    - name: Check formatting
      run: uv run --group dev ruff format --check .
