[project]
name = "rfest"
description = "Python 3 toolbox for receptive field estimation"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Ziwei Huang" },
    { name = "Jonathan Oesterle" },
]
maintainers = [{ name = "Ziwei Huang", email = "huang-ziwei@outlook.com" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "jax",
    "matplotlib",
    "numpy",
    "scikit-learn",
    "scipy",
]
dynamic = ["version"]

[project.optional-dependencies]
# rfest.check falls back to a warning when cv2 is missing, and skips contour areas.
contours = ["opencv-python"]

[project.urls]
Homepage = "https://github.com/berenslab/RFEst"
Issues = "https://github.com/berenslab/RFEst/issues"

[dependency-groups]
# ruff is pinned to a minor series: it is a gate in CI, and a formatting change
# in a new release would turn that gate red on a tree nobody touched.
dev = ["pytest", "ruff>=0.16,<0.17"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "rfest.version.__version__" }

[tool.setuptools.packages.find]
include = ["rfest*"]

[tool.ruff]
# Pinned rather than left to the default, so that a change in ruff's own
# default is a deliberate edit here rather than a repo-wide reformat nobody
# asked for. 88 is what the already-formatted files in the tree use.
line-length = 88

# Markdown is left alone. Ruff formats the python blocks inside it, and in a
# README that means splitting a one-line call across three because a trailing
# comment pushed it past the limit -- a worse example for the sake of a rule
# the block is not compiled under anyway.
extend-exclude = ["*.md"]

[tool.ruff.format]
# The trailing commas in this tree are a habit of writing `[8, ]` and
# `f([params[i], ], ...)`, not a request to keep those calls exploded across
# eight lines. Collapse whatever fits.
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
# Required to agree with skip-magic-trailing-comma above.
split-on-trailing-comma = false
